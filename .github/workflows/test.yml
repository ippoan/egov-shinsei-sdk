name: CI

# Node.js SDK 向け CI。typecheck + test を走らせる。
# frontend-ci.yml ではなく lib-ci.yml を使う:
#   - egov-shinsei-sdk は npm package で wrangler / Cloudflare deploy を
#     持たない (frontend-ci.yml 経由だと secret-verify が wrangler.toml
#     を探して失敗する)
#   - publish は分離した publish.yml が v* tag push で走らせる

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: read

jobs:
  ci:
    uses: ippoan/ci-workflows/.github/workflows/lib-ci.yml@main
    with:
      node_version: '22'
      # eslint config も lint script も無いので無効化
      run_lint: 'false'
    secrets: inherit
