name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write
  # frontend-ci.yml の nested `secret-verify` job が WIF OIDC token を mint
  # するために id-token: write を要求する。`gcp_secret_verify_*` input を
  # 渡していなくても reusable parse 時の caller permissions check が走るため、
  # declare していないと workflow 全体が startup_failure になる
  # (ci-workflows CLAUDE.md "Option A" 参照)。
  id-token: write

jobs:
  ci:
    uses: ippoan/ci-workflows/.github/workflows/frontend-ci.yml@main
    with:
      project_type: 'worker'
      has_tests: true
      has_deploy: false
      has_staging_deploy: false
      typecheck_command: 'npx tsc --noEmit --skipLibCheck'
      test_command: 'npx vitest run --coverage --reporter=default --reporter=json --outputFile.json=coverage/test-results.json'
      npm_scope: '@ippoan'
      npm_publish_directory: '.'
      npm_publish_name: 'egov-shinsei-sdk'
    secrets: inherit
